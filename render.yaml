services:
  - type: web
    name: notezy
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: notezy
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AI_AGENT_SHARED_SECRET
        generateValue: true
      - key: TZ
        value: Asia/Ho_Chi_Minh
