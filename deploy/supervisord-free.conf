[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/notezy-supervisord.pid

[program:apache]
command=/bin/bash /var/www/html/entrypoint.sh
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ai]
command=python3 ai_agent/server.py
directory=/var/www/html
user=www-data
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:collaboration]
command=python3 collaboration_ws.py
directory=/var/www/html
user=www-data
environment=COLLAB_SECRET="%(ENV_AI_AGENT_SHARED_SECRET)s"
priority=20
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
